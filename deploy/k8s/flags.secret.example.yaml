# Example flag Secret. COPY to flags.secret.yaml, set real per-event values,
# and keep that copy OUT of git (see .gitignore). Create per team namespace:
#
#   kubectl -n team-07 apply -f flags.secret.yaml
#
# FLAG1_AE_TITLE : stage-1 flag. The accepted called AE title. DICOM caps AE
#                  titles at 16 bytes, so this is a short secret the scoreboard
#                  stores verbatim (NOT a BHV{...} wrapper). Keep it to
#                  [A-Z0-9_-], <= 16 chars. It is auto-added to the service-AET
#                  pool so the inventory wordlist can find it.
# FLAG2_PRIVATE  : stage-2 flag, returned in private tag (0009,"SCARE_FLOOR_DCM",01).
#                  Normal BHV{...} format, <= 64 chars (LO VR).
apiVersion: v1
kind: Secret
metadata:
  name: scare-floor-flags
type: Opaque
stringData:
  FLAG1_AE_TITLE: "BHV_XR_9F2C71A4"
  FLAG2_PRIVATE: "BHV{sc4re_fl00r_pr1v4te_t4g_xr}"
